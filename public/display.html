<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه ی جامع طرح اکرام و باقیات الصالحات - نمایشگر زنده</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;700;900&family=Lalezar&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- اتصال به سوکت از طریق CDN برای فایل مستقل -->
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        @keyframes scrollSeamless {
            0% { transform: translate3d(-50%, 0, 0); }
            100% { transform: translate3d(0, 0, 0); }
        }
        
        .marquee-content {
            display: flex;
            width: max-content;
            will-change: transform;
            align-items: center;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">

    <div class="relative w-full h-screen overflow-hidden bg-slate-950 font-sans select-none" dir="ltr">
        
        <!-- دکمه خروج کوچک و قابل مشاهده -->
        <button 
            id="exitButton"
            onclick="window.location.href='/'"
            class="absolute top-3 left-3 z-[100] w-8 h-8 flex items-center justify-center rounded-full bg-black/30 text-white/40 hover:bg-red-600 hover:text-white transition-all duration-300 backdrop-blur-sm border border-white/5 shadow-lg cursor-pointer" 
            title="خروج از حالت نمایشگر"
        >
            <i class="fas fa-times text-xs"></i>
        </button>

        <!-- Background Layer -->
        <div id="bgImage" class="absolute inset-0 bg-cover bg-center z-0 transition-all duration-1000 opacity-60"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-slate-900 via-slate-900/50 to-slate-900 z-0"></div>

        <div class="relative z-10 flex flex-col h-full" dir="rtl">
            
            <!-- Header Section -->
            <div class="flex-shrink-0 flex items-center justify-between px-4 md:px-12 py-4 h-[25vh] md:h-[28vh] border-b border-white/5 bg-black/20 backdrop-blur-sm">
                <div class="flex flex-col justify-center h-full max-w-[70%]">
                    <h1 id="eventTitle" class="font-black drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] border-r-8 border-yellow-500 pr-6 transition-all duration-300 break-words leading-tight" style="color: #ffffff; font-size: 3.5rem;">
                        در حال بارگذاری...
                    </h1>
                </div>

                <div id="deceasedContainer" class="h-full py-2 flex items-center hidden">
                    <div class="h-[90%] aspect-[3/4] relative rounded-2xl overflow-hidden shadow-[0_0_30px_rgba(234,179,8,0.3)] ring-4 ring-yellow-500/80 bg-slate-800">
                       <img id="deceasedImage" src="" class="w-full h-full object-cover" alt="Deceased" />
                       <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black via-black/70 to-transparent pt-8 pb-2 text-center">
                          <span id="deceasedLabel" class="font-bold drop-shadow-md"></span>
                       </div>
                    </div>
                </div>
            </div>

            <!-- Marquee Lists -->
            <div class="flex-grow flex flex-col w-full min-h-0 bg-black/10">
                
                <!-- High Tier -->
                <div data-base-class="h-[38%] w-full relative overflow-hidden flex items-center" class="h-[38%] w-full relative overflow-hidden flex items-center" dir="ltr">
                    <div id="highMarquee" class="marquee-content"></div>
                </div>

                <!-- Mid Tier -->
                <div data-base-class="h-[32%] w-full relative overflow-hidden flex items-center" class="h-[32%] w-full relative overflow-hidden flex items-center" dir="ltr">
                    <div id="midMarquee" class="marquee-content"></div>
                </div>

                <!-- Low Tier -->
                <div data-base-class="h-[30%] w-full relative overflow-hidden flex items-center" class="h-[30%] w-full relative overflow-hidden flex items-center" dir="ltr">
                    <div id="lowMarquee" class="marquee-content"></div>
                </div>

            </div>

            <!-- Footer -->
            <div class="flex-shrink-0 h-[7vh] flex items-center justify-center bg-black/80 backdrop-blur-md border-t border-white/10">
                <p id="footerText" class="font-bold animate-pulse text-center px-4 drop-shadow-lg text-lg">
                </p>
            </div>

        </div>
    </div>

    <!-- Announcement Overlay -->
    <div id="announcementOverlay" class="fixed inset-0 bg-black z-[9999] flex items-center justify-center hidden">
        <button onclick="window.location.href='/'" class="absolute top-4 left-4 text-white/50 hover:text-white z-50 p-4"><i class="fas fa-times text-2xl"></i></button>
        <img id="announcementImg" src="" class="max-w-full max-h-full object-contain" alt="Announcement" />
    </div>

    <script>
        const DEFAULT_SETTINGS = {
            fontSize: 40,
            scrollSpeed: 20,
            fontSizeHigh: 64,
            fontSizeMid: 48,
            fontSizeLow: 36,
            speedHigh: 14,
            speedMid: 20,
            speedLow: 24,
            highThreshold: 5000000,
            midThreshold: 1000000,
            fontHigh: 'Vazirmatn',
            fontMid: 'Vazirmatn',
            fontLow: 'Vazirmatn',
            showAnnouncement: false,
            eventTitle: 'مراسم ترحیم',
            titleColor: '#ffffff',
            titleSize: 3.5,
            deceasedLabel: 'شادروان',
            deceasedLabelColor: '#fef3c7',
            deceasedLabelSize: 12,
            footerText: 'شادی روح درگذشتگان صلوات',
            footerColor: '#ffffff',
            footerSize: 14,
        };

        let currentSettings = { ...DEFAULT_SETTINGS };
        let currentDonations = [];
        let activeEventId = 'active';

        const BASE_URL = 'https://kheyriyeh3.hudsonparker87.workers.dev';

        // توابع کمکی برای درخواست به سرور
        async function fetchJSON(endpoint) {
            try {
                const url = BASE_URL + endpoint;
                // جلوگیری از کش شدن اطلاعات
                const res = await fetch(url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now());
                if (!res.ok) return null;
                return await res.json();
            } catch (e) {
                console.error('Fetch error:', e);
                return null;
            }
        }

        async function updateData() {
            const [eventData, configData] = await Promise.all([
                fetchJSON('/api/db/events/active'),
                fetchJSON('/api/db/config/displaySettings')
            ]);
            
            if (eventData && eventData.id) activeEventId = eventData.id;
            
            const configVal = (configData && configData.value) ? configData.value : {};
            const effectiveTitle = (eventData && eventData.title) ? eventData.title : (configVal.eventTitle || DEFAULT_SETTINGS.eventTitle);
            
            currentSettings = { ...DEFAULT_SETTINGS, ...configVal, eventTitle: effectiveTitle };
            
            const donations = await fetchJSON(`/api/db/donations/${activeEventId}/approved`);
            if (donations && Array.isArray(donations)) {
                currentDonations = donations;
            }

            render();
        }

        function createMarqueeItem(item, fontSize, font) {
            const div = document.createElement('div');
            div.className = "flex flex-col items-center justify-center px-6 md:px-10 mx-2 py-2 rounded-2xl border border-white/10 bg-white/5 backdrop-blur-md shadow-xl flex-shrink-0";
            div.style.fontFamily = font;
            div.style.minWidth = 'fit-content';
            
            const nameSpan = document.createElement('span');
            nameSpan.className = "font-bold whitespace-nowrap drop-shadow-lg text-yellow-50";
            nameSpan.style.fontSize = `${fontSize}px`;
            nameSpan.style.lineHeight = '1.4';
            nameSpan.textContent = item.donorName;
            div.appendChild(nameSpan);

            if (item.fatherName) {
                const fatherSpan = document.createElement('span');
                fatherSpan.className = "text-white/90 font-light mt-0.5 whitespace-nowrap tracking-wide";
                fatherSpan.style.fontSize = `${fontSize * 0.55}px`;
                fatherSpan.textContent = `(${item.fatherName})`;
                div.appendChild(fatherSpan);
            }

            return div;
        }

        function renderMarqueeRow(containerId, list, speed, fontSize, font, bgClasses, emptyClasses) {
            const wrapper = document.getElementById(containerId).parentElement;
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            if (!list || list.length === 0) {
                const empty = document.createElement('div');
                empty.className = "w-full flex items-center justify-center h-full";
                empty.innerHTML = `<span class="text-white/20 text-lg font-bold italic animate-pulse">...</span>`;
                
                // Override wrapper classes to match empty state of Display.tsx
                wrapper.className = wrapper.dataset.baseClass + " " + emptyClasses;
                
                container.style.animation = 'none';
                container.className = "w-full h-full";
                container.appendChild(empty);
                return;
            }

            // Restore wrapper classes
            wrapper.className = wrapper.dataset.baseClass + " " + bgClasses;
            container.className = "flex w-max will-change-transform items-center";

            let items = [...list];
            const MIN_ITEMS = 40;
            while (items.length < MIN_ITEMS) {
                items = [...items, ...list];
            }
            const renderList = [...items, ...items];
            
            const duration = (renderList.length * 120) / (speed || 20);

            renderList.forEach(item => {
                container.appendChild(createMarqueeItem(item, fontSize, font));
            });

            container.style.animation = `scrollSeamless ${duration}s linear infinite`;
        }

        function render() {
            const isMobile = window.innerWidth < 768;
            const fontScale = isMobile ? 0.5 : 1;

            const speedHigh = currentSettings.speedHigh ?? Math.round((currentSettings.scrollSpeed || 20) * 0.7);
            const speedMid = currentSettings.speedMid ?? (currentSettings.scrollSpeed || 20);
            const speedLow = currentSettings.speedLow ?? Math.round((currentSettings.scrollSpeed || 20) * 1.2);

            const fontSizeHigh = (currentSettings.fontSizeHigh ?? Math.round((currentSettings.fontSize || 40) * 1.6)) * fontScale;
            const fontSizeMid = (currentSettings.fontSizeMid ?? Math.round((currentSettings.fontSize || 40) * 1.2)) * fontScale;
            const fontSizeLow = (currentSettings.fontSizeLow ?? Math.round((currentSettings.fontSize || 40) * 0.9)) * fontScale;

            // اطلاعیه تمام‌صفحه
            const overlay = document.getElementById('announcementOverlay');
            if (currentSettings.showAnnouncement && currentSettings.announcementImage) {
                overlay.classList.remove('hidden');
                document.getElementById('announcementImg').src = currentSettings.announcementImage;
                return; // در صورت نمایش بنر اطلاعیه، ادامه رندر نیاز نیست
            } else {
                overlay.classList.add('hidden');
            }

            // تصویر پس‌زمینه
            const bgImage = document.getElementById('bgImage');
            if (currentSettings.bgImage) {
                bgImage.style.backgroundImage = `url(${currentSettings.bgImage})`;
            } else {
                bgImage.style.backgroundImage = 'none';
            }

            // سربرگ (Header)
            const titleEl = document.getElementById('eventTitle');
            titleEl.textContent = currentSettings.eventTitle;
            titleEl.style.color = currentSettings.titleColor;
            titleEl.style.fontSize = `${isMobile ? Math.max(1.5, currentSettings.titleSize * 0.6) : currentSettings.titleSize}rem`;

            // تصویر متوفی
            const deceasedContainer = document.getElementById('deceasedContainer');
            if (currentSettings.deceasedImage) {
                deceasedContainer.classList.remove('hidden');
                document.getElementById('deceasedImage').src = currentSettings.deceasedImage;
                
                const label = document.getElementById('deceasedLabel');
                label.textContent = currentSettings.deceasedLabel;
                label.style.color = currentSettings.deceasedLabelColor;
                label.style.fontSize = `${isMobile ? 12 : currentSettings.deceasedLabelSize}px`;
            } else {
                deceasedContainer.classList.add('hidden');
            }

            // بارگذاری فونت شخصی (در صورت وجود)
            if (currentSettings.customFontData && typeof FontFace !== 'undefined') {
                const fontFace = new FontFace('CustomUploaded', `url(${currentSettings.customFontData})`);
                fontFace.load().then(loadedFace => {
                    if (document.fonts) document.fonts.add(loadedFace);
                }).catch(e => console.error("Font load error:", e));
            }

            // پاصفحه (Footer)
            const footerEl = document.getElementById('footerText');
            footerEl.textContent = currentSettings.footerText;
            footerEl.style.color = currentSettings.footerColor;
            footerEl.style.fontSize = `${isMobile ? currentSettings.footerSize * 0.8 : currentSettings.footerSize}px`;

            // جداسازی ردیف‌های اهداکنندگان
            const visibleDonations = currentDonations.filter(d => !d.hideName);
            const high = visibleDonations.filter(d => d.amount >= currentSettings.highThreshold);
            const mid = visibleDonations.filter(d => d.amount < currentSettings.highThreshold && d.amount >= currentSettings.midThreshold);
            const low = visibleDonations.filter(d => d.amount < currentSettings.midThreshold);

            // رندر نوارهای متحرک
            renderMarqueeRow('highMarquee', high, speedHigh, fontSizeHigh, currentSettings.fontHigh, 
                "bg-gradient-to-r from-yellow-900/30 via-yellow-900/10 to-yellow-900/30 border-yellow-500/20 border-b border-white/10 backdrop-blur-sm shadow-lg", 
                "border-b border-white/5 bg-black/10 backdrop-blur-sm");
                
            renderMarqueeRow('midMarquee', mid, speedMid, fontSizeMid, currentSettings.fontMid, 
                "bg-gradient-to-r from-blue-900/30 via-blue-900/10 to-blue-900/30 border-blue-500/20 border-b border-white/10 backdrop-blur-sm shadow-lg", 
                "border-b border-white/5 bg-black/10 backdrop-blur-sm");
                
            renderMarqueeRow('lowMarquee', low, speedLow, fontSizeLow, currentSettings.fontLow, 
                "bg-gradient-to-r from-slate-900/40 via-slate-800/20 to-slate-900/40 border-white/5 border-b border-white/10 backdrop-blur-sm shadow-lg", 
                "border-b border-white/5 bg-black/10 backdrop-blur-sm");
        }

        // اجرای اولیه
        updateData();
        
        // درخواست پشتیبان به سرور (در صورت قطعی احتمالی سوکت هر 30 ثانیه)
        setInterval(updateData, 30000); 

        // اتصال به Socket.io
        if (typeof io !== 'undefined') {
            const socket = io(BASE_URL, { path: '/socket.io', transports: ['websocket', 'polling'] });
            socket.on('db_change', () => {
                updateData();
            });
        }
        
        // بروزرسانی اندازه فونت‌ها هنگام تغییر سایز صفحه
        window.addEventListener('resize', render);

    </script>
</body>
</html>
