name: 🚀 Run M3U8 Streamer (Neon Storage)

on:
  workflow_dispatch:
    inputs:
      quality:
        description: 'Stream Quality (Resolution)'
        required: true
        default: '720p'
        type: choice
        options:
          - '240p'
          - '360p'
          - '480p'
          - '720p'
          - '1080p'
          - '1440p'
      fps:
        description: 'Frames Per Second (FPS)'
        required: true
        default: '30'
        type: choice
        options:
          - '15'
          - '20'
          - '30'
          - '60'
      duration:
        description: 'Duration to run in minutes (Max 360 mins on GitHub)'
        required: true
        default: '60'
        type: string
      url:
        description: 'Target Display URL to stream'
        required: false
        default: ''
        type: string

jobs:
  stream:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Server Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg
          python -m pip install --upgrade pip
          pip install flask boto3 requests

      - name: 🎬 Run Streamer
        env:
          TARGET_URL: ${{ github.event.inputs.url || secrets.TARGET_URL || vars.TARGET_URL || secrets.STREAM_TARGET_URL || vars.STREAM_TARGET_URL || '' }}
          STREAM_TARGET_URL: ${{ github.event.inputs.url || secrets.STREAM_TARGET_URL || vars.STREAM_TARGET_URL || secrets.TARGET_URL || vars.TARGET_URL || '' }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL || vars.S3_ENDPOINT_URL || '' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || '' }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || vars.AWS_DEFAULT_REGION || 'us-east-2' }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME || vars.S3_BUCKET_NAME || 'm3u8-streamer' }}
        run: |
          python -u cli_webpage_to_m3u8.py --quality "${{ github.event.inputs.quality }}" --fps "${{ github.event.inputs.fps }}" --duration "${{ github.event.inputs.duration }}" --url "${{ github.event.inputs.url || env.TARGET_URL || env.STREAM_TARGET_URL }}"
